<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate with Bold Signature</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ... your previous certificate styles ... */

    /* Custom class to make the signature look bold and dark */
    .bold-signature {
      filter: contrast(175%) brightness(60%) saturate(150%);
      mix-blend-mode: multiply; /* Removes white background bleeding */
    }
  </style>
</head>
<body class="bg-gray-200 p-8">

  <div class="flex flex-col md:flex-row justify-between items-end px-4 text-xs text-gray-800 gap-4">
    
    <div class="w-48 text-left relative">
      
      <div class="absolute bottom-4 left-0 w-32 h-16">
        <img src="sign.png" alt="Signature" class="w-full h-full object-contain bold-signature">
      </div>
      
      <div class="border-b border-gray-600 mb-1 w-full"></div>
      <span>Examiner's Signature</span>
    </div>

    <div class="text-right">
      <p>The Certificate issued is valid for maximum of 5 years from the above date</p>
    </div>
  </div>

</body>
</html>
